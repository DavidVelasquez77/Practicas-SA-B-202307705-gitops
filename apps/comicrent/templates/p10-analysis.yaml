{{- if and .Values.global.progressiveDelivery.apiGateway.enabled (dig "observability" "enabled" false (default dict .Values.global)) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-metrics
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/part-of: comicrent
    app.kubernetes.io/component: progressive-delivery
spec:
  args:
    - name: rollout-hash
  metrics:
    - name: candidate-request-volume
      initialDelay: 90s
      failureLimit: 0
      # Require enough recent candidate requests for a useful error ratio and p95.
      successCondition: result[0] >= 20
      provider:
        prometheus:
          address: http://p10-observability-kube-pro-prometheus.observability.svc.cluster.local:9090
          timeout: 10
          query: |
            sum(increase(comicrent_http_requests_total{
              namespace="{{ .Values.global.namespace }}",
              service="api-gateway",
              rollouts_pod_template_hash="{{ "{{args.rollout-hash}}" }}"
            }[5m])) or vector(0)
    - name: candidate-error-ratio
      initialDelay: 90s
      failureLimit: 0
      # Availability SLO 99.9%: permit at most 0.1% server errors/timeouts.
      successCondition: result[0] <= 0.001
      provider:
        prometheus:
          address: http://p10-observability-kube-pro-prometheus.observability.svc.cluster.local:9090
          timeout: 10
          query: |
            (
              sum(increase(comicrent_http_requests_total{
                namespace="{{ .Values.global.namespace }}",
                service="api-gateway",
                rollouts_pod_template_hash="{{ "{{args.rollout-hash}}" }}",
                status_class=~"5xx|timeout"
              }[5m]))
              /
              clamp_min(sum(increase(comicrent_http_requests_total{
                namespace="{{ .Values.global.namespace }}",
                service="api-gateway",
                rollouts_pod_template_hash="{{ "{{args.rollout-hash}}" }}"
              }[5m])), 1)
            ) or vector(0)
    - name: candidate-p95-latency
      initialDelay: 90s
      failureLimit: 0
      successCondition: result[0] <= 0.5
      provider:
        prometheus:
          address: http://p10-observability-kube-pro-prometheus.observability.svc.cluster.local:9090
          timeout: 10
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(comicrent_http_request_duration_seconds_bucket{
                namespace="{{ .Values.global.namespace }}",
                service="api-gateway",
                rollouts_pod_template_hash="{{ "{{args.rollout-hash}}" }}"
              }[5m]))
            ) or vector(0)
{{- end }}
