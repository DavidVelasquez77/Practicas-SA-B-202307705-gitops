p9Mode: true
# P9 environment: three-instance CloudNativePG with synchronous replication
# and native backups to the persistent GCS bucket; rebuilds recover from GCS.
namespace: sa-p9

p9PostgresHA:
  enabled: true
  bootstrapImport: false
  bootstrapRecovery: true

global:
  environment: p10-observability
  namespace: sa-p9
  observability:
    enabled: true
    otlpEndpoint: http://p10-otel-collector.observability.svc.cluster.local:4318
    metricsPort: 9464
  progressiveDelivery:
    apiGateway:
      enabled: true
  security:
    allowInsecureImages: false
  secrets:
    create: false
  database:
    existingSecret: ""
  networkPolicy:
    externalPostgres:
      enabled: false

postgresql:
  enabled: false
  namespaceOverride: sa-p9
  fullnameOverride: comicrent-postgresql
  architecture: standalone
  image:
    registry: registry-1.docker.io
    repository: bitnami/postgresql
    tag: "18.6.0"
    digest: sha256:7d77a46bbf200709237318c27dec0eaeae2520e403dd18fdebde2be7a6b04993
    pullPolicy: IfNotPresent
  auth:
    enablePostgresUser: true
    username: comicrent_user
    database: auth_db
    existingSecret: comicrent-postgresql-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    # This is a single-writer database with one persistent volume. Protect it
    # from voluntary eviction; scaling this StatefulSet would create a second,
    # independent database, not a safe HA replica.
    pdb:
      create: true
      minAvailable: 1
      maxUnavailable: ""
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      fsGroup: 1001
    persistence:
      enabled: true
      size: 2Gi
      storageClass: standard-rwo

rabbitmq:
  namespaceOverride: sa-p9
  fullnameOverride: comicrent-rabbitmq
  replicaCount: 3
  podAntiAffinityPreset: hard
  pdb:
    create: true
    minAvailable: 2
    maxUnavailable: ""
  extraConfiguration: |
    default_queue_type = quorum
  # Kyverno requires non-root identity at pod and container level.
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard-rwo
  auth:
    username: comicrent
    existingPasswordSecret: comicrent-rabbitmq-secret
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: comicrent-rabbitmq-erlang-cookie
    existingSecretErlangKey: rabbitmq-erlang-cookie

api-gateway:
  replicaCount: 3
  deploymentRevision: "p10-v0.9.2-node-resilience-review-2"
  config:
    authServiceUrl: "http://comicrent-p9-workloads-auth-service:3001"
    comicsServiceUrl: "http://comicrent-p9-workloads-comics-service:3002/graphql"
    rentalsServiceUrl: "http://comicrent-p9-workloads-rentals-service:8001/graphql"
    copiesServiceUrl: "http://comicrent-p9-workloads-copies-service:8002"
  autoscaling:
    enabled: false
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-api-gateway
    tag: "v0.9.2"
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 3000

auth-service:
  replicaCount: 2
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-auth-service
    tag: "v0.9.2"
    pullPolicy: Always

comics-service:
  replicaCount: 2
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-comics-service
    tag: "v0.9.2"
    pullPolicy: Always

rentals-service:
  replicaCount: 2
  config:
    comicsServiceUrl: "http://comicrent-p9-workloads-comics-service:3002/graphql"
    copiesServiceUrl: "http://comicrent-p9-workloads-copies-service:8002"
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-rentals-service
    tag: "v0.9.2"
    pullPolicy: Always

copies-service:
  replicaCount: 2
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-copies-service
    tag: "v0.9.2"
    pullPolicy: Always

copies-consumer:
  replicaCount: 2
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-copies-service
    tag: "v0.8.5"
    pullPolicy: Always

operations-jobs:
  global:
    namespace: sa-p9
  image:
    repository: ghcr.io/davidvelasquez77/comicrent-operations-jobs
    tag: "v0.8.5"
    pullPolicy: Always
  database:
    host: comicrent-postgresql-ha-rw
  summaryConsumer:
    replicaCount: 2

extraLabels:
  project: comicrent
  practice: p9
  managedByCourse: software-avanzado
