apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "5" }
spec:
  project: comicrent-p9
  source:
    repoURL: https://github.com/DavidVelasquez77/Practicas-SA-B-202307705-gitops.git
    targetRevision: p9-continuidad-operativa
    path: apps/p9/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      name: comicrent-verify-cosign
      jsonPointers:
        # Kyverno defaults this field in the live CRD, but it is absent from
        # the versioned CRD schema used by Argo CD's structured diff.
        - /spec/rules/0/verifyImages/0/attestors/0/entries/0/signatureAlgorithm
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=false, ServerSideApply=true]
