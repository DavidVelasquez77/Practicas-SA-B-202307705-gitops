apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: comicrent-p9-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  labels:
    app.kubernetes.io/part-of: comicrent-p9
spec:
  project: comicrent-p9
  ignoreDifferences:
    - group: ""
      kind: Service
      name: comicrent-api-gateway-canary
      namespace: sa-p9
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: comicrent-p9-workloads-api-gateway
      namespace: sa-p9
      jsonPointers:
        - /spec/selector
  source:
    repoURL: https://github.com/DavidVelasquez77/Practicas-SA-B-202307705-gitops.git
    targetRevision: p9/technical-node-resilience
    path: apps/comicrent
    helm:
      valueFiles:
        - values-p10.yaml
        - values-p10-maintenance.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p9
  # Manual sync is used during the one-time database migration so the
  # application can be quiesced before importing its final consistent copy.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
