apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - project.yaml
  - sealed-secret-grafana.yaml
  - applications/prometheus.yaml
  - applications/loki.yaml
  - applications/tempo.yaml
  - applications/otel-collector.yaml
  - applications/alloy.yaml
  - rules/slo-rules.yaml
configMapGenerator:
  - name: comicrent-operations-dashboard
    namespace: observability
    files:
      - dashboards/comicrent-operations.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
