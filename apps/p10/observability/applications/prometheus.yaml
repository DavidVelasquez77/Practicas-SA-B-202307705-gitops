apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: comicrent-p10
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.3.0
      helm:
        releaseName: p10-observability
        valueFiles:
          - $values/apps/p10/observability/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/DavidVelasquez77/Practicas-SA-B-202307705-gitops.git
      targetRevision: feature/p10-observability
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
