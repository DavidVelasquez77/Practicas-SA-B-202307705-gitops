apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: comicrent-p10
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: p10-alloy
        valueFiles:
          - $values/apps/p10/observability/values/alloy.yaml
    - repoURL: https://github.com/DavidVelasquez77/Practicas-SA-B-202307705-gitops.git
      targetRevision: feature/p10-observability
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
