apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: comicrent-p10
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: p10-tempo
        valueFiles:
          - $values/apps/p10/observability/values/tempo.yaml
    - repoURL: https://github.com/DavidVelasquez77/Practicas-SA-B-202307705-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
