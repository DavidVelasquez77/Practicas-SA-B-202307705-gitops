tempo:
  multitenancyEnabled: false
  reportingEnabled: false
  retention: 48h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

metricsGenerator:
  enabled: false
tempoQuery:
  enabled: false
persistence:
  enabled: true
  storageClassName: standard-rwo
  accessModes:
    - ReadWriteOnce
  size: 4Gi
