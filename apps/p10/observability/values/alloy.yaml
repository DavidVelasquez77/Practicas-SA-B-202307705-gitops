alloy:
  enableHttpServerPort: false
  configMap:
    content: |-
      logging {
        level = "info"
        format = "logfmt"
      }

      discovery.kubernetes "comicrent" {
        role = "pod"
        namespaces {
          names = ["sa-p9"]
        }
      }

      discovery.relabel "comicrent" {
        targets = discovery.kubernetes.comicrent.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      loki.source.kubernetes "comicrent" {
        targets    = discovery.relabel.comicrent.output
        forward_to = [loki.process.comicrent.receiver]
      }

      loki.process "comicrent" {
        forward_to = [loki.write.local.receiver]

        stage.cri {}

        stage.json {
          expressions = {
            trace_id       = "trace_id",
            span_id        = "span_id",
            correlation_id = "correlation_id",
          }
        }

        stage.structured_metadata {
          values = {
            trace_id       = "trace_id",
            span_id        = "span_id",
            correlation_id = "correlation_id",
          }
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://p10-loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

rbac:
  create: true
  namespaces:
    - sa-p9
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - pods/log
      verbs:
        - get
        - list
        - watch
  clusterRules: []

serviceAccount:
  create: true
  automountServiceAccountToken: true

configReloader:
  enabled: true
